name: Daily Crawl

on:
  schedule:
    # UTC 0:00 = 北京时间 8:00（每日自动爬取）
    - cron: '0 0 * * *'
  workflow_dispatch: {} # 手动触发

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # 可选：只跑指定数据源（逗号分隔），例如 SOURCES=作文网
          SOURCES: ${{ secrets.SOURCES }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GLM_MODEL: glm-4-flash
        run: node scripts/crawl.js

      - name: Report failure
        if: failure()
        run: echo "::error::爬虫运行失败，请检查上方日志"
